<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Both themes are first-class: the page follows the OS until the reader
         pins one with the theme toggle. The UA paints what the token layer
         does not reach (the canvas past a short document, the overscroll area,
         the control faces it draws itself), so it has to know both. -->
    <meta name="color-scheme" content="light dark">
    <title>recoverage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/print.css" media="print">
    <!-- The two faces the injected stylesheet names. Preloaded so the first
         paint of the dashboard is in its own type rather than a swap later. -->
    <link rel="preload" href="/archivo.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
    <!-- The app cannot know the target id until /api/targets answers, so the
         coverage map is otherwise two serialized round trips after the shell
         lands. Preloading it as a fetch starts that request during the preload
         scan instead; the plain same-origin fetch() then reuses the preloaded
         response rather than issuing a second one. -->
    <link rel="preload" href="/api/targets" as="fetch">
    <!-- The first paint. The app mounts only after this document's own inline
         bundle has been parsed and run, and the dashboard it draws is
         serialized behind /api/targets and /data, so an empty #root paints a
         blank page for the whole of that. The boot block below is in the HTML
         for that reason, and main.tsx removes it before the app mounts. Its
         rules are here because the injected sheet is the built Tailwind
         output, which carries no class for markup that never went through the
         bundler. They read the tokens that sheet declares, with light-theme
         literals for `vite dev`, where the sheet arrives after this paint. -->
    <style>
      #boot, .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 60vh;
        color: var(--color-text-muted, #55585f);
        font-family: var(--font-sans, sans-serif);
        font-size: var(--text-data, 14px);
        line-height: 1.5;
      }
      .boot p {
        max-width: 40em;
        margin: 0;
        text-align: center;
      }
      .boot-word {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--color-text, #0a0a0b);
        font-size: var(--text-intro, 18px);
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .boot-mark {
        fill: currentColor;
      }
      .boot-mark .lit {
        fill: var(--color-accent, #0f7a42);
      }
      .boot-mark .unlit {
        fill: var(--color-border-strong, #d5d8de);
      }
    </style>
    <!-- INJECT_CSS -->
    <!-- The pinned theme, before the first paint. The bundle applies it too
         (`web/app/App.tsx`), but a frame late: the first paint would be the
         OS theme and then flip. With nothing stored the attribute stays off
         and the tokens follow the OS. This is the one place the shell repeats
         the app's rule, and it has to: nothing else runs before the paint. -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("recoverage_theme");
        } catch {
          // Storage can be blocked; the OS preference still answers.
        }
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <p class="boot-word">
          <svg class="boot-mark" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><rect x="1.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="9" y="1.5" width="6" height="6" rx="1.5"/><rect class="lit" x="16.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="1.5" y="9" width="6" height="6" rx="1.5"/><rect class="unlit" x="9" y="9" width="6" height="6" rx="1.5"/><rect class="unlit" x="16.5" y="9" width="6" height="6" rx="1.5"/><rect x="1.5" y="16.5" width="6" height="6" rx="1.5"/><rect class="unlit" x="9" y="16.5" width="6" height="6" rx="1.5"/><rect class="unlit" x="16.5" y="16.5" width="6" height="6" rx="1.5"/></svg>
          recoverage
        </p>
        <p role="status">Loading coverage…</p>
      </div>
    </div>
    <!-- The dashboard IS the inlined bundle below, so a reader whose browser
         has scripting off never gets past the boot block above. Potato Mode
         renders the same coverage as server-side HTML, so the way in is named
         here rather than left for them to find. -->
    <noscript>
      <div class="boot">
        <p>The interactive coverage map needs JavaScript, which this browser has turned off.</p>
        <p><a href="/potato">Open Potato Mode</a> for the same coverage as plain server-rendered HTML.</p>
      </div>
    </noscript>
    <!-- INJECT_JS -->
  </body>
</html>
