[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverage"
dynamic = ["version"]
description = "Coverage dashboard for binary-matching decompilation projects"
requires-python = ">=3.12"
license = "MIT"
keywords = ["reverse-engineering", "decompilation", "code-coverage", "binary-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "bottle>=0.12",
    "brotli>=1.1",
    "rcssmin>=1.1",
    "rich>=13.0",
    "rjsmin>=1.2",
    "typer>=0.9",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/relumea/recoverage"
Repository = "https://github.com/relumea/recoverage"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
capstone = [
    "capstone>=5.0",
]
playwright = [
    "playwright>=1.40",
    "pytest-playwright>=0.6",
]
pygments = [
    "pygments>=2.0",
]

[project.scripts]
recoverage = "recoverage.cli:main"

[tool.setuptools.dynamic]
version = {attr = "recoverage.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recoverage = ["assets/*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_playwright.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
