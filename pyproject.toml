[build-system]
# setuptools 77 is the first release implementing PEP 639 (SPDX license
# expressions); the `license = "MIT"` field below fails validation on older
# versions, so the floor must stay at or above that.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverage"
dynamic = ["version"]
description = "Coverage dashboard for binary-matching decompilation projects"
requires-python = ">=3.13"
license = "MIT"
# NOTICE carries the grants for the third-party browser blobs under
# src/recoverage/assets, which ship inside the wheel. Without it here a wheel
# consumer gets the MIT license and no way back to VanJS or Highlight.js.
license-files = ["LICENSE", "NOTICE"]
keywords = ["reverse-engineering", "decompilation", "code-coverage", "binary-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Pure-Python package; every dependency ships wheels for the three OSes
    # the test matrix exercises (see .github/workflows/ci.yml) and README
    # claims "any machine".
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "bottle>=0.13",
    "brotli>=1.1",
    "rcssmin>=1.1",
    # In-process regen (`recoverage regen`, `serve --regen`, POST /api/regen)
    # and the shared rebrew-project.toml + coverage.db resolution
    # (rebrew.workspace, stdlib only), so recoverage does not carry its own
    # copy.  Resolved from the sibling checkout by [tool.uv.sources] below.
    # 2.10.0 is the floor. Regen imports rebrew.catalog.cli.run_catalog
    # (rebrew.catalog stopped re-exporting it in 2.7.0). Readers take
    # coverage_db_lock shared around open_sqlite_ro, and 2.10.0 is the
    # first release that ships that lock. The schema stamp since 2.7.0
    # is "10".
    "rebrew>=2.10.0",
    "rich>=15.0.0",
    "rjsmin>=1.2",
    "typer>=0.27.2",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/relumea/recoverage"
Repository = "https://github.com/relumea/recoverage"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
capstone = [
    "capstone>=5.0",
]
playwright = [
    "playwright>=1.62",
    "pytest-playwright>=0.9.0",
]
pygments = [
    "pygments>=2.21.0",
]

[project.scripts]
recoverage = "recoverage.cli:main"

[tool.setuptools.dynamic]
version = {attr = "recoverage.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recoverage = ["assets/*"]

[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep: uv resolves it relative to this pyproject.toml,
# keeping the manifest free of machine-specific absolute paths.
rebrew = { path = "../rebrew", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp keeps the run's tmp root inside the checkout. pytest shares
# /tmp/pytest-of-$USER across every project on the host and garbage-collects
# the numbered dirs it finds there at session end; a directory another project
# made undeletable turns that into a PytestWarning, which filterwarnings =
# ["error"] below turns into a failed run that has nothing to do with this
# tree. pytest clears the basetemp itself, so the pinned path stays private.
addopts = "--ignore=tests/test_playwright.py --basetemp=.pytest-tmp"
# Every warning is a failure: the suite runs clean, so a new ResourceWarning
# (unclosed socket/file/connection), deprecation, or unraisable exception
# must break the build instead of scrolling past.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# RUF001-RUF003 flag every confusable in prose; the multiplication sign is
# deliberate typography in the coverage arithmetic, not a homoglyph typo.
allowed-confusables = ["×"]
# Core groups (E/F/W/I/UP/B/SIM) plus correctness-oriented groups proven clean
# on this tree:
#   A      — shadowing builtins; ASYNC — blocking calls in async code;
#   DTZ    — naive datetime; G — logging format-string misuse;
#   N      — naming conventions; PGH — bans blanket noqa / type: ignore;
#   TID    — import hygiene; YTT — yield-in-try/finally traps;
#   RUF    — unused unpacked bindings, mutable class attributes, slicing;
#   RUF100 — flags stale or unscoped `noqa` directives (suppression hygiene);
#   T10    — debugger/breakpoint calls must never be committed;
#   FLY    — str.join over += loops; ICN — import conventions;
#   PTH    — os.path over pathlib (Path is already the tree's idiom);
#   PLE    — pylint errors (real-defect class); INT — gettext format misuse;
#   C4     — comprehensions; RET/RSE — return/raise shape;
#   PERF   — performance anti-patterns; PIE — misc correctness nits;
#   ISC    — implicit string concatenation (missing-comma bug class);
#   FURB   — clearer stdlib idioms;
#   ERA    — commented-out code left behind (dead-logic class);
#   LOG    — logging call misuse (stdlib logging, not the `logging` plugin);
#   FA     — future-annotation hygiene; Q — quote consistency;
#   TD     — TODO/FIXME/XXX markers; PT — pytest fixture/marker misuse.
# The remaining bandit and pylint rules are selected one code at a time
# instead of by group prefix, because a prefix pulls in rules this tree does
# not yet pass and each of those needs a decision of its own:
#   S102/S107 — exec, hardcoded password; S2/S5/S7 — Flask debug, request
#   without timeout, assert, trojan source; S3xx — pickle/marshal/XML
#   deserialisation; S6xx — shell and partial-path process launches;
#   PLC/PLW    — the pylint correctness rules outside PLE (unnecessary-dunder
#   call, nan comparison, bad raise type, encoding-less open, useless
#   else-on-loop, self-assignment, global-at-statement).
# S101 (assert), S103/S104/S105/S106/S108 (hardcoded secret, wildcard bind),
# S310/S311 (urlopen scheme, non-crypto rng) and S603/S607/S608 (untrusted
# argv, partial path, string-built SQL) stay off: the suite asserts by
# design, the server binds 127.0.0.1, and the SQL and argv fragments are
# built from validated column names rather than request input.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM",
    "A", "ASYNC", "DTZ", "G", "N", "PGH", "TID", "YTT", "RUF100",
    "T10", "FLY", "ICN", "PTH",
    "PLE", "INT", "C4", "RET", "RSE", "PERF", "PIE", "ISC", "FURB", "RUF",
    "T20", "ERA", "LOG", "FA", "Q", "TD", "PT",
    "S2", "S5", "S7", "S102", "S103", "S107",
    "S301", "S302", "S303", "S304", "S305", "S306", "S307", "S308",
    "S312", "S313", "S314", "S315", "S316", "S317", "S318", "S319",
    "S321", "S323", "S324",
    "S601", "S602", "S604", "S605", "S606", "S609", "S610", "S611", "S612",
    "PLC0205", "PLC0206", "PLC0208", "PLC0414", "PLC3002",
    "PLW0120", "PLW0127", "PLW0128", "PLW0129", "PLW0133", "PLW0177",
    "PLW0211", "PLW0602", "PLW0604", "PLW0642", "PLW1508", "PLW1509",
    "PLW1641", "PLW2101", "PLW3301",
]
# PT006 wants argnames as a tuple or list; the suite spells them the pytest
# way, as one comma-separated string ("raw,expected"). PT018 asks for one
# assert per line; the compact `assert a in x and b in y` form is how the
# table-driven cases read.
ignore = ["PT006", "PT018"]
# typer's idiom is `param = typer.Option(...)` in signature defaults; without
# this, B008 would demand a noqa on every CLI option (typer docs recommend it).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# E501: potato.py embeds a server-side HTML template as long literal lines;
# ruff format cannot wrap string literals. Every other file must keep lines
# within the 100-col cap above.
"src/recoverage/potato.py" = ["E501"]
# T201: tools/ scripts are command-line utilities whose stdout output IS their
# interface; print is intentional there and banned everywhere else.
"tools/*" = ["T201"]
