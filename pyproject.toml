[build-system]
# setuptools 77 is the first release implementing PEP 639 (SPDX license
# expressions); the `license = "MIT"` field below fails validation on older
# versions, so the floor must match.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverage"
dynamic = ["version"]
description = "Coverage dashboard for binary-matching decompilation projects"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reverse-engineering", "decompilation", "code-coverage", "binary-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Pure-Python package; every dependency ships wheels for the three OSes
    # the test matrix exercises (see .github/workflows/ci.yml) and README
    # claims "any machine".
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "bottle>=0.13",
    "brotli>=1.1",
    "rcssmin>=1.1",
    "rich>=13.0",
    "rjsmin>=1.2",
    "typer>=0.9",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/relumea/recoverage"
Repository = "https://github.com/relumea/recoverage"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
capstone = [
    "capstone>=5.0",
]
playwright = [
    "playwright>=1.40",
    "pytest-playwright>=0.6",
]
pygments = [
    "pygments>=2.0",
]

[project.scripts]
recoverage = "recoverage.cli:main"

[tool.setuptools.dynamic]
version = {attr = "recoverage.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recoverage = ["assets/*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_playwright.py"
# Every warning is a failure: the suite runs clean, so a new ResourceWarning
# (unclosed socket/file/connection), deprecation, or unraisable exception
# must break the build instead of scrolling past.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Core groups (E/F/W/I/UP/B/SIM) plus correctness-oriented groups proven clean
# on this tree:
#   A      — shadowing builtins; ASYNC — blocking calls in async code;
#   DTZ    — naive datetime; G — logging format-string misuse;
#   N      — naming conventions; PGH — bans blanket noqa / type: ignore;
#   TID    — import hygiene; YTT — yield-in-try/finally traps;
#   RUF100 — flags stale or unscoped `noqa` directives (suppression hygiene);
#   T10    — debugger/breakpoint calls must never be committed;
#   FLY    — str.join over += loops; ICN — import conventions;
#   PLE    — pylint errors (real-defect class); INT — gettext format misuse;
#   C4     — comprehensions; RET/RSE — return/raise shape;
#   PERF   — performance anti-patterns; PIE — misc correctness nits;
#   ISC    — implicit string concatenation (missing-comma bug class);
#   FURB   — clearer stdlib idioms.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM",
    "A", "ASYNC", "DTZ", "G", "N", "PGH", "TID", "YTT", "RUF100",
    "T10", "FLY", "ICN",
    "PLE", "INT", "C4", "RET", "RSE", "PERF", "PIE", "ISC", "FURB",
    "T20",
]
ignore = []
# typer's idiom is `param = typer.Option(...)` in signature defaults; without
# this, B008 would demand a noqa on every CLI option (typer docs recommend it).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# E501: potato.py embeds a server-side HTML template as long literal lines;
# ruff format cannot wrap string literals. Every other file must keep lines
# within the 100-col cap above.
"src/recoverage/potato.py" = ["E501"]
# T201: tools/ scripts are command-line utilities whose stdout output IS their
# interface; print is intentional there and banned everywhere else.
"tools/*" = ["T201"]
