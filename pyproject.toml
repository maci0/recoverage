[build-system]
# setuptools 77 is the first release implementing PEP 639 (SPDX license
# expressions); the `license = "MIT"` field below fails validation on older
# versions, so the floor must stay at or above that.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverage"
dynamic = ["version"]
description = "Coverage dashboard for binary-matching decompilation projects"
# Without this the wheel METADATA carries a one-line summary and no body, so
# the published page shows the bare description. setuptools ships README.md in
# the sdist either way; this is what puts it in the metadata.
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# NOTICE carries the grants for the third-party code `make web-build` compiles
# into the browser assets, which ship inside the wheel. Without it here a wheel
# consumer gets the MIT license and no way back to Preact or Highlight.js.
license-files = ["LICENSE", "NOTICE"]
keywords = ["reverse-engineering", "decompilation", "code-coverage", "binary-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Pure-Python package; every dependency ships wheels for the three OSes
    # the test matrix exercises (see .github/workflows/ci.yml) and README
    # claims "any machine".
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "bottle>=0.13",
    "brotli>=1.1",
    "rcssmin>=1.1",
    # In-process regen (`recoverage regen`, `serve --regen`, POST /api/regen),
    # the shared rebrew-project.toml + coverage-directory resolution
    # (rebrew.workspace, stdlib only) and the reader/writer for the coverage
    # documents (rebrew.coverage_toml), so recoverage does not carry its own
    # copy of any of it.  Resolved from the sibling checkout by
    # [tool.uv.sources] below.
    # 2.16.0 is the floor: it is the first release that ships
    # rebrew.coverage_toml, which both the regen path writes and every read
    # path parses; an older rebrew has no such module and no way to produce
    # the documents.  (Regen also imports rebrew.catalog.cli.run_catalog,
    # which rebrew.catalog stopped re-exporting in 2.7.0 — that older reason
    # is subsumed by this floor.)
    "rebrew>=2.16.0",
    "rich>=15.0.0",
    "rjsmin>=1.2",
    "typer>=0.27.2",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/relumea/recoverage"
Repository = "https://github.com/relumea/recoverage"
Changelog = "https://github.com/relumea/recoverage/blob/main/CHANGELOG.md"
Issues = "https://github.com/relumea/recoverage/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
capstone = [
    "capstone>=5.0",
]
playwright = [
    "playwright>=1.62",
    "pytest-playwright>=0.9.0",
]
pygments = [
    "pygments>=2.21.0",
]

[project.scripts]
recoverage = "recoverage.cli:main"

[tool.setuptools.dynamic]
version = {attr = "recoverage.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recoverage = ["assets/*"]

# The console script is the only thing a package index hands a user, so it
# ships a man page with it. data_files is the only mechanism a wheel has for
# this: pip installs share/man/man1/ into the prefix, and every Unix `man`
# path already on the machine finds it. MANIFEST.in carries the same file
# into the sdist, or a wheel rebuilt from the published archive would ship
# the entry point and nothing to read about it.
[tool.setuptools.data-files]
"share/man/man1" = ["man/recoverage.1"]

[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep: uv resolves it relative to this pyproject.toml,
# keeping the manifest free of machine-specific absolute paths.
rebrew = { path = "../rebrew", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp keeps the run's tmp root inside the checkout. pytest shares
# /tmp/pytest-of-$USER across every project on the host and garbage-collects
# the numbered dirs it finds there at session end; a directory another project
# made undeletable turns that into a PytestWarning, which filterwarnings =
# ["error"] below turns into a failed run that has nothing to do with this
# tree. pytest clears the basetemp itself, so the pinned path stays private.
addopts = "--ignore=tests/test_playwright.py --basetemp=.pytest-tmp"
# Every warning is a failure: the suite runs clean, so a new ResourceWarning
# (unclosed socket/file/connection), deprecation, or unraisable exception
# must break the build instead of scrolling past.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
# The gate covers src/ and tools/ only. tests/ stays out until its fixtures
# carry the annotations; make test-one is the loop that grows them.
files = ["src/recoverage", "tools"]
python_version = "3.13"
# Strict, minus the two checks this tree cannot pass:
#   disallow_untyped_decorators — every route handler carries @app.route /
#   @app.get, and bottle is untyped, so the decorator erases the signature.
#   no_implicit_reexport — api.py, ui.py and potato.py import the shared
#   server names (request, response, HTTPResponse) from recoverage.server on
#   purpose, so every route module imports the same objects from one module.
# Everything else --strict turns on passes today; a new module inherits it.
# There is deliberately no [[tool.mypy.overrides]] table: `files` above puts
# tools/ under the same gate as src/, and the tree passes it without one, so
# an override is a hole in `strict` that nothing reads back.
# tests/test_supply_chain.py fails when one comes back.
strict = true
disallow_untyped_decorators = false
no_implicit_reexport = false
# The runtime deps (bottle, brotli, rcssmin, rjsmin) ship no py.typed, so
# every import of them is an error mypy cannot see past. ignore_missing_imports
# is what covers them, tree-wide rather than per import site: a per-site
# `# type: ignore[import-untyped]` would be redundant under this setting, and
# warn_unused_ignores below would then report each one as a stale suppression.
# The setting is therefore one tree-wide statement about these four packages,
# and every `type: ignore` left in the tree is one a reader can trust to be
# silencing a real error.
ignore_missing_imports = true
# A `type: ignore` is a claim about code that is not checked; nothing keeps it
# true. warn_unused_ignores turns the claim into a gate: a suppression whose
# error is gone (the annotation moved, the dependency shipped py.typed, the
# line was deleted) fails the run instead of outliving the finding it silences.
warn_unused_ignores = true
# --strict does not reach these two, and the tree passes both today. They are
# the checks that find a comparison or a branch the code cannot take, which is
# a defect rather than a style: warn_unreachable reports a narrowing that ends
# in a return or a raise, and strict_equality reports an identity comparison
# against a literal or across types, where `==` and `is` disagree (1 and True,
# 0 and False). Turning either on is what makes a later edit that reaches an
# unreachable arm fail here instead of shipping it. Both were proven clean by
# a run before they were written down, and tests/test_supply_chain.py holds
# them on.
warn_unreachable = true
strict_equality = true

[tool.ruff.lint]
# RUF001-RUF003 flag every confusable in prose; the multiplication sign is
# deliberate typography in the coverage arithmetic, not a homoglyph typo.
allowed-confusables = ["×"]
# Core groups (E/F/W/I/UP/B/SIM) plus correctness-oriented groups proven clean
# on this tree:
#   A      — shadowing builtins; ASYNC — blocking calls in async code;
#   DTZ    — naive datetime; G — logging format-string misuse;
#   N      — naming conventions; PGH — bans blanket noqa / type: ignore;
#   TID    — import hygiene; YTT — yield-in-try/finally traps;
#   RUF    — unused unpacked bindings, mutable class attributes, slicing;
#   RUF100 — flags stale or unscoped `noqa` directives (suppression hygiene);
#   T10    — debugger/breakpoint calls must never be committed;
#   FLY    — str.join over += loops; ICN — import conventions;
#   PTH    — os.path over pathlib (Path is already the tree's idiom);
#   PLE    — pylint errors (real-defect class); INT — gettext format misuse;
#   C4     — comprehensions; RET/RSE — return/raise shape;
#   PERF   — performance anti-patterns; PIE — misc correctness nits;
#   ISC    — implicit string concatenation (missing-comma bug class);
#   FURB   — clearer stdlib idioms;
#   ERA    — commented-out code left behind (dead-logic class);
#   LOG    — logging call misuse (stdlib logging, not the `logging` plugin);
#   FA     — future-annotation hygiene; Q — quote consistency;
#   TD     — TODO/FIXME/XXX markers; PT — pytest fixture/marker misuse.
# The remaining bandit and pylint rules are selected one code at a time
# instead of by group prefix, because a prefix pulls in rules this tree does
# not yet pass and each of those needs a decision of its own:
#   S102/S107 — exec, hardcoded password; S2/S5/S7 — Flask debug, request
#   without timeout, assert, trojan source; S3xx — pickle/marshal/XML
#   deserialisation; S6xx — shell and partial-path process launches;
#   S104-S108/S310/S311 — wildcard bind, hardcoded secret, /tmp path, urlopen
#   scheme, non-crypto rng. On for src/ and tools/; the tests/* per-file-ignore
#   below carries the reason, since every finding they produce is a fixture
#   that deliberately binds every interface, names a token, uses /tmp, or
#   seeds a PRNG.
#   PLC/PLW  — the pylint correctness rules outside PLE (unnecessary-dunder
#   call, nan comparison, bad raise type, encoding-less open, useless
#   else-on-loop, self-assignment, global-at-statement), plus the PLR and TRY
#   codes listed in select that are defect classes rather than size limits.
# S101 (assert) and S603/S607/S608 (untrusted argv, partial path, string-built
# SQL) stay off: the suite asserts by design, and the SQL and argv fragments
# are built from validated column names rather than request input.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM",
    "A", "ASYNC", "DTZ", "G", "N", "PGH", "TID", "YTT", "RUF100",
    "T10", "FLY", "ICN", "PTH",
    "PLE", "INT", "C4", "RET", "RSE", "PERF", "PIE", "ISC", "FURB", "RUF",
    "T20", "ERA", "LOG", "FA", "Q", "TD", "PT",
    "S2", "S5", "S7", "S102", "S103", "S104", "S105", "S106", "S107",
    "S108", "S310", "S311",
    "S301", "S302", "S303", "S304", "S305", "S306", "S307", "S308",
    "S312", "S313", "S314", "S315", "S316", "S317", "S318", "S319",
    "S321", "S323", "S324",
    "S601", "S602", "S604", "S605", "S606", "S609", "S610", "S611", "S612",
    "PLC0205", "PLC0206", "PLC0208", "PLC0414", "PLC3002",
    "PLW0120", "PLW0127", "PLW0128", "PLW0129", "PLW0131", "PLW0133",
    "PLW0177", "PLW0211", "PLW0245", "PLW0406", "PLW0602", "PLW0604",
    "PLW0642", "PLW0711", "PLW1501", "PLW1507", "PLW1508", "PLW1509",
    "PLW1641", "PLW2101", "PLW3301",
    # pylint refactor rules that are defect classes rather than size limits:
    # comparing a value with itself, comparing two constants, a property that
    # takes arguments, an argument rebound from a local, a bool chain that
    # cannot short-circuit, sys.exit reachable outside the entry point, an
    # empty comment, a dict or list index lookup whose key is known to exist.
    "PLR0124", "PLR0133", "PLR0206", "PLR1704", "PLR1716", "PLR1722",
    "PLR1733", "PLR1736", "PLR2044",
    # A trailing `return` at the end of a function hides the statement that
    # was meant to be the last one, which is how an assignment or a log line
    # silently stops running. It ran clean before it was written here, so it
    # costs nothing to keep on.
    "PLR1711",
    # tryceratops: vanilla-raise, type-check-without-type-error, verbose
    # raise, useless try/except, logging the exception class instead of the
    # instance. TRY200 (reraise without cause) is B904, already covered by the
    # B group; TRY300 (return in try) and TRY003 (long message in raise) are
    # the two this tree does not pass yet.
    "TRY002", "TRY004", "TRY201", "TRY203", "TRY400", "TRY401",
]
# PT006 wants argnames as a tuple or list; the suite spells them the pytest
# way, as one comma-separated string ("raw,expected"). PT018 asks for one
# assert per line; the compact `assert a in x and b in y` form is how the
# table-driven cases read.
ignore = ["PT006", "PT018"]
# typer's idiom is `param = typer.Option(...)` in signature defaults; without
# this, B008 would demand a noqa on every CLI option (typer docs recommend it).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# E501: potato.py embeds a server-side HTML template as long literal lines;
# ruff format cannot wrap string literals. Every other file must keep lines
# within the 100-col cap above.
"src/recoverage/potato.py" = ["E501"]
# A002: devserver.py overrides http.server's log_message/log_error, whose
# signature names the printf template `format`. The name is the override
# contract these two methods exist to satisfy, so renaming the parameter would
# make them read as something other than the stdlib methods they replace.
"src/recoverage/devserver.py" = ["A002"]
# T201: tools/ scripts are command-line utilities whose stdout output IS their
# interface; print is intentional there and banned everywhere else.
"tools/*" = ["T201"]
# S104/S105/S106/S108/S310/S311: the suite asserts on the shapes the security
# rules exist to prevent, so its fixtures have to spell them out. A test binds
# 0.0.0.0 to prove the server refuses a non-loopback peer, passes a token and
# a /tmp db path through the config parser, and seeds a PRNG for the fuzz
# campaign. None of this reaches the server: it binds 127.0.0.1, and the S1xx
# codes are on for src/ and tools/, where a wildcard bind or a hardcoded
# secret would be a real finding.
"tests/*" = ["S104", "S105", "S106", "S108", "S310", "S311"]
