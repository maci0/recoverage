<!doctype html>
<!-- Development shell only.
     The served dashboard is assembled by `recoverage.ui` from
     `src/recoverage/assets/index.html`, where the bundle is inlined; this file
     exists so `vite dev` has a document to mount the same app into. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReCoverage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/print.css" media="print" />
    <link rel="preload" href="/api/targets" as="fetch" />
    <style>
      #boot, .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 60vh;
        color: var(--muted, #8b949e);
        font-family: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
        font-size: var(--text-label, 12px);
        line-height: 1.5;
      }
      .boot p {
        max-width: 40em;
        margin: 0;
        text-align: center;
      }
      .boot-mark {
        display: inline-flex;
        align-items: center;
        padding: 2px 10px;
        border: 2px solid var(--c, #06b6d4);
        color: var(--c, #06b6d4);
        font-size: var(--text-mark, 24px);
        font-weight: 800;
        box-shadow: var(--shadow-glow, none);
      }
      .boot-word {
        color: var(--text, #e7edf4);
        font-size: var(--text-wordmark, 20px);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span class="boot-mark" aria-hidden="true">R</span>
        <p class="boot-word">ReCoverage</p>
        <p role="status">Loading coverage…</p>
      </div>
    </div>
    <!-- The served shell carries the same first paint and the same fallback:
         see the note in src/recoverage/assets/index.html, which is the
         document a reader actually gets. -->
    <noscript>
      <div class="boot">
        <p>The interactive coverage map needs JavaScript, which this browser has turned off.</p>
        <p><a href="/potato">Open Potato Mode</a> for the same coverage as plain server-rendered HTML.</p>
      </div>
    </noscript>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
