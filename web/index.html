<!doctype html>
<!-- Development shell only.
     The served dashboard is assembled by `recoverage.ui` from
     `src/recoverage/assets/index.html`, where the bundle is inlined; this file
     exists so `vite dev` has a document to mount the same app into. The boot
     block, the theme script and the fallback are copies of that file's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>recoverage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/print.css" media="print" />
    <link rel="preload" href="/api/targets" as="fetch" crossorigin />
    <style>
      #boot, .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 60vh;
        color: var(--color-text-muted, #55585f);
        font-family: var(--font-sans, sans-serif);
        font-size: var(--text-data, 14px);
        line-height: 1.5;
      }
      .boot p {
        max-width: 40em;
        margin: 0;
        text-align: center;
      }
      .boot-word {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--color-text, #0a0a0b);
        font-size: var(--text-intro, 18px);
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .boot-mark {
        fill: currentColor;
      }
      .boot-mark .lit {
        fill: var(--color-accent, #0f7a42);
      }
      .boot-mark .unlit {
        fill: var(--color-border-strong, #d5d8de);
      }
    </style>
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("recoverage_theme");
        } catch {
          // Storage can be blocked; the OS preference still answers.
        }
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <p class="boot-word">
          <svg class="boot-mark" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><rect x="1.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="9" y="1.5" width="6" height="6" rx="1.5"/><rect class="lit" x="16.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="1.5" y="9" width="6" height="6" rx="1.5"/><rect class="unlit" x="9" y="9" width="6" height="6" rx="1.5"/><rect class="unlit" x="16.5" y="9" width="6" height="6" rx="1.5"/><rect x="1.5" y="16.5" width="6" height="6" rx="1.5"/><rect class="unlit" x="9" y="16.5" width="6" height="6" rx="1.5"/><rect class="unlit" x="16.5" y="16.5" width="6" height="6" rx="1.5"/></svg>
          recoverage
        </p>
        <p role="status">Loading coverage…</p>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <p>The interactive coverage map needs JavaScript, which this browser has turned off.</p>
        <p><a href="/potato">Open Potato Mode</a> for the same coverage as plain server-rendered HTML.</p>
      </div>
    </noscript>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
