name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src/ tests/ tools/
      - run: uv run ruff check src/ tests/ tools/

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: "Lint JS/TS (oxlint: Rika-Labs strict + anti-slop)"
        run: npm run lint:js
      - name: Lint HTML/CSS (Nu Html Checker)
        run: npm run lint:html

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Keep in sync with the Python classifiers in pyproject.toml.
        python-version: ["3.12", "3.13", "3.14"]
        # The README claims recoverage "runs independently on any machine",
        # and pip users run it on all three OSes; exercise that claim on at
        # least one non-Linux runner per OS instead of asserting it untested.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --ignore=tests/test_playwright.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Boot dashboard against a sample coverage.db and probe it
        run: uv run python tools/smoke.py
      - name: Negative smoke (corrupt DB must degrade, not lie)
        run: uv run python tools/smoke.py --expect-failure
