name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run the pipeline by hand, off any branch: a flaky runner, a dependency
  # index that was down, or a build whose diagnostic the diffoscope path only
  # prints on the run that failed. The alternative is an empty commit, which
  # lands on the branch and shows up in the history as a change that changed
  # nothing. The jobs are the same ones a push runs, so a manual run is the
  # same evidence as an automatic one.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch supersedes the run in flight, whose result nobody
# will read. main keeps its history: a cancelled workflow would drop a required
# check from the commit list and leave the branch looking unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every Linux job names the image by version, never `ubuntu-latest`. That
  # label moves with the runner fleet, and the image is where this pipeline
  # gets tools nothing in the tree pins: `shellcheck` and `yamllint` (the
  # lint job's shell and Actions gates) and `diffoscope` (the build job's
  # reproducibility diagnostic). A fleet update could add or drop a rule, or
  # remove the tool entirely, and the same commit would lint differently on
  # two runs, or fail a gate that was green a week earlier. Everything else
  # the pipeline runs is pinned in the tree (uv by version, Python by
  # .python-version, bun by package.json, every action by commit); the runner
  # image was the one input left to the host. Bump the label with the same
  # review as an action pin, and tests/test_supply_chain.py fails when a job
  # goes back to a moving label.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      # The Makefile owns these commands, so the jobs call the targets rather
      # than restating them: `make all` is the local mirror of the pipeline, and
      # a copy of a recipe in two files is a recipe that drifts. UV_RUN is
      # `uv run --locked --extra dev`. --locked on every uv run in this
      # workflow, for two reasons: a bare `uv run` re-resolves and may write a
      # new lockfile, and `--frozen` alone would install the committed
      # uv.lock even when pyproject.toml no longer matches it, so a dependency
      # edit that skipped `uv lock` would test a tree the manifest does not
      # describe. --locked refuses that instead of installing it.
      - run: make format-check
      - run: make lint
      # mypy runs strict over src/ and tools/; the three checks it cannot
      # pass yet are named with their reason in pyproject.toml [tool.mypy].
      - run: make type-check
      # shellcheck and yamllint ship on the runner image; they cover the two
      # non-Python source sets ruff does not see (tools/*.sh, .github/*.yml).
      - run: make shell-lint
      - run: make yaml-lint
      # The license half of the Python inventory: NOTICE and
      # tools/bundled_js_inventory.py cover what the wheel BUNDLES and
      # `make python-sbom` covers the resolved tree's hashes, and nothing read
      # what a consumer may do with the packages it INSTALLS. The sbom job has
      # no environment and no sibling rebrew, which is why this runs here, in
      # the job that has already synced the dev extra.
      - run: make license-inventory

  web-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # package.json's packageManager field is the bun pin, so CI installs
          # the version a contributor's bun install would resolve to.
          bun-version-file: package.json
      # oxlint and the vnu jar are downloaded, not built, so node_modules is
      # fully reproducible from bun.lock. Caching it on the lockfile hash turns
      # every re-run of this job into a cache hit and keeps the java setup off
      # the critical path. The cache key never hits on a lockfile change, so a
      # dependency bump still installs from the registry; package.json is
      # hashed with it, because a tree installed by another bun is not the tree
      # bun.lock describes.
      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: "Lint JS/TS (oxlint: Rika-Labs strict + anti-slop) and HTML/CSS (Nu Html Checker)"
        # make web-lint owns the install, the bun/java preflight and both
        # linters, so this job and `make all` run the same commands. lint:html
        # runs tools/lint_html.py through the env synced above, which is why
        # this job needs uv at all.
        run: make web-lint
      - name: "Type-check the frontend (tsc --noEmit over web/tsconfig.json)"
        # oxlint runs without type information (the Rika preset is flattened
        # with typeAware: false), so this is the only step that verifies
        # web/tsconfig.json's strict settings against the sources. Without it a
        # type error reaches main, and with it the committed bundle.
        run: make typecheck-web

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Keep in sync with the Python classifiers in pyproject.toml;
        # tests/test_supply_chain.py fails when they drift apart.
        python-version: ["3.13", "3.14"]
        # The README claims recoverage "runs independently on any machine",
        # and pip users run it on all three OSes; exercise that claim on at
        # least one non-Linux runner per OS instead of asserting it untested.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - name: Run the suite
        # The same command as `make test`, spelled out rather than delegated:
        # this matrix runs on the Windows runner, where make is not part of the
        # image's guaranteed toolchain, and a missing make would fail a job
        # before it ran a test.
        # PYTHONHASHSEED matches the Makefile's PYTHON_HASH_SEED, which exports
        # the same default to every local recipe.  It has to be set here
        # because this job does not go through make, and CPython reads the seed
        # at interpreter startup, so a value set inside the test session is
        # too late.  tests/test_supply_chain.py fails when the two disagree.
        env:
          PYTHONHASHSEED: "0"
        run: >-
          uv run --locked --extra dev python -m pytest tests/ -v
          --ignore=tests/test_playwright.py

  build:
    # The only job that produces a distributable artifact, and the one a
    # release is cut from, so it waits for the suite: without this a commit
    # whose tests fail still attaches `recoverage-dist` to the run, and
    # anything that downloads a workflow artifact takes the wheel from the
    # run's head rather than from a run that passed. `make all` runs the same
    # two in this order, so the local mirror and the pipeline agree on which
    # artifact is a candidate.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # `make build` runs the frontend bundler before it packages, so this job
      # needs bun: the dashboard ships built assets, and rebuilding them in
      # both trees is what proves the committed bundle matches its sources.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # `make build` runs the frontend bundler before it packages, in this
      # tree and in the second one below, and `bun install --frozen-lockfile`
      # is the step that reaches the registry. The same key the web-lint job
      # uses: bun.lock alone, hashed with package.json because a tree another
      # bun installed is not the tree bun.lock describes. A lockfile change
      # misses, so a dependency bump still installs from the registry; the
      # second tree reads bun's own package cache in the same job, which is
      # why one restore covers both builds.
      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      # Nothing else in this workflow builds the artifact, so a wheel missing
      # an asset, a backend that stopped stamping from
      # SOURCE_DATE_EPOCH, or a normalizer that stopped removing the sdist's
      # uid and mtimes would ship unnoticed. Build twice and diff the hashes:
      # the second build runs in a copy of the tree under a different path,
      # with a different locale and timezone, which is what a path- or
      # host-dependent artifact shows up as.
      - name: Build the distribution twice and compare
        run: |
          set -euo pipefail
          # Every destination is removed, not merely created. RUNNER_TEMP
          # outlives one execution of this step (a self-hosted runner, a
          # retried step, a local reproduction of it), and the two steps below
          # both MERGE into what they find: the tar below leaves a file that
          # has since been deleted from the tracked tree, and the second build
          # then packages it, so the two builds are compared across different
          # trees and report a difference that is not one. `ln -s` fails the
          # same way a step louder, with "File exists", before any build runs.
          work="$RUNNER_TEMP/rebuild"
          first="$RUNNER_TEMP/first"
          rm -rf -- "$work" "$first" "$RUNNER_TEMP/rebrew"
          mkdir -p -- "$first" "$work"
          # The second tree carries the tracked files only: dist/ is what the
          # second build produces, and .git would make the copy as large as
          # the checkout. SOURCE_DATE_EPOCH below replaces the one thing the
          # recipe would otherwise read out of .git.
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$work"
          # pyproject.toml resolves rebrew from ../rebrew, and `make build`
          # ends in a `uv run` that syncs the environment, so the copy needs
          # the sibling checkout the composite action just made. A symlink is
          # enough: only the path has to resolve from the copied tree.
          ln -s "$GITHUB_WORKSPACE/../rebrew" "$RUNNER_TEMP/rebrew"

          make build
          # The dashboard bundle is committed and `make build` regenerates it
          # from web/ before packaging, so the two-build comparison below would
          # pass on a tree whose committed app.js was already stale: both trees
          # rebuild the same bytes from the same sources. The Makefile target
          # owns that check so this job and `make all` run the same one, and
          # its recipe records why it exists.
          make check-bundle-clean

          cp dist/*.whl dist/*.tar.gz "$first/"

          # A different path, locale and timezone: an artifact carrying a
          # build-host absolute path or an unstamped mtime shows up here.
          cd "$work"
          LC_ALL=C.UTF-8 TZ=Asia/Tokyo make build
          # A differing archive is the one failure in this workflow a reader
          # cannot act on without a diff, so the step prints the two hashes
          # itself (the only facts it has) and adds diffoscope's field-by-field
          # breakdown when the image carries it. The runner ships no
          # diffoscope, so the unguarded call was a `command not found`
          # swallowed by `|| true`: the step failed naming the artifact and
          # nothing else, which is the one answer that cannot say what moved.
          for artifact in dist/*.whl dist/*.tar.gz; do
            name="$(basename "$artifact")"
            if ! cmp -s "$artifact" "$first/$name"; then
              echo "::error::$name is not reproducible across path, locale and timezone"
              echo "$name expected: $(sha256sum "$first/$name" | cut -d' ' -f1)"
              echo "$name actual:   $(sha256sum "$artifact" | cut -d' ' -f1)"
              if command -v diffoscope >/dev/null 2>&1; then
                diffoscope "$first/$name" "$artifact" || true
              else
                echo "diffoscope is not on this image; it names the field that moved"
              fi
              exit 1
            fi
            echo "$name reproducible: $(sha256sum "$artifact" | cut -d' ' -f1)"
          done
        env:
          # The stamp is pinned to a constant rather than the commit's own date
          # (which the Makefile defaults to), so the two builds cannot disagree
          # over anything but the tree. LC_ALL/TZ for the first build come from
          # the recipe; the second build overrides them on the command line.
          SOURCE_DATE_EPOCH: "1700000000"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recoverage-dist
          path: dist/*
          # A build that produced nothing is a broken build, not a warning:
          # upload-artifact defaults to `warn` and the job would go green with
          # no artifact attached.
          if-no-files-found: error
          retention-days: 30

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - name: Boot dashboard against sample coverage documents and probe it
        run: make smoke
      - name: Negative smoke (corrupt document must degrade, not lie)
        run: make smoke-fail

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # PYTHONHASHSEED matches the Makefile's PYTHON_HASH_SEED, which every
    # local recipe exports. It is spelled out here for the one step that
    # starts a Python interpreter without going through make: the browser
    # inventory below runs `python tools/bundled_js_inventory.py` directly, and
    # CPython reads the seed at interpreter startup, so a value set inside the
    # tool would be too late. That inventory is an uploaded artifact, so two
    # runs of one commit have to produce the same bytes for it to be diffable.
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          # The browser inventory below is a stdlib-only tool that reads
          # bun.lock, so it needs an interpreter and no environment, which is
          # what keeps it runnable in the one job with no sibling checkout.
          python-version-file: .python-version
      # Hash-pinned inventory of the full resolved tree (runtime deps plus
      # every extra) so consumers and vuln scanners can see exactly what a
      # given build was made from.
      # `make python-sbom` is the one command that produces this artifact: the
      # uv export plus the two rebrew pin lines read out of
      # tools/ci_clone_rebrew.sh. The job redirects it into a file rather than
      # spelling the same export and the same two sed patterns again, because a
      # second copy of the pin reading is a second answer to "which rebrew was
      # this built from" that a change to the script would leave disagreeing
      # with the artifact a contributor prints locally. That target is the one
      # recipe here with no `ensure-rebrew` and no `uv run`, so it needs neither
      # the sibling checkout nor a synced environment: --frozen reads uv.lock
      # alone, which is what lets the job that has no ../rebrew run it.
      - name: Export hashed dependency inventory
        run: make python-sbom > recoverage-python-sbom.txt && test -s recoverage-python-sbom.txt
      # The export above is the Python half of the tree and the whole of what
      # uv.lock knows. The other half ships in the wheel: `make web-build`
      # compiles six npm devDependencies into src/recoverage/assets/, so a
      # consumer reading only this job's output cannot tell which Preact or
      # highlight.js runs in their browser. The tool reads bun.lock, so the
      # versions and tarball digests are the resolved ones.
      - name: Export the browser-bundle inventory
        run: |
          set -euo pipefail
          # The commit's own timestamp, the same stamp `make build` exports, so
          # the SPDX document's `created` is a function of the commit rather
          # than of the minute the job ran: this artifact is uploaded, and two
          # runs of one commit have to produce the same bytes to be diffable.
          #
          # Refused when it is not a number, rather than exported empty: the
          # tool treats an EMPTY SOURCE_DATE_EPOCH as "no stamp given" and
          # falls back to the wall clock, so a git that failed or a tree with
          # no commits would upload an artifact stamped with the minute the job
          # ran and no line saying so — the exact nondeterminism this stamp
          # exists to remove, arriving through the failure path. `make build`
          # cannot reach it because its stamp carries FALLBACK_SOURCE_DATE_EPOCH.
          stamp="$(git log -1 --format=%ct 2>/dev/null || true)"
          case "$stamp" in
            ''|*[!0-9]*)
              echo "::error::no commit timestamp (got '${stamp}')"
              echo "the SPDX artifact would carry the wall clock instead of the commit"
              exit 1
              ;;
          esac
          export SOURCE_DATE_EPOCH="$stamp"
          python tools/bundled_js_inventory.py --output recoverage-browser-sbom.txt
          test -s recoverage-browser-sbom.txt
          # The same rows as an SPDX 2.3 document, which is the shape a
          # vulnerability scanner ingests. The text file above is the one a
          # reader opens; without this one, the browser half of the tree is
          # described in a format no tool reads.
          python tools/bundled_js_inventory.py --format spdx \
            --output recoverage-browser-spdx.json
          test -s recoverage-browser-spdx.json
