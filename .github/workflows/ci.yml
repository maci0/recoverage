name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch supersedes the run in flight, whose result nobody
# will read. main keeps its history: a cancelled workflow would drop a required
# check from the commit list and leave the branch looking unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      # The Makefile owns these commands, so the jobs call the targets rather
      # than restating them: `make all` is the local mirror of the pipeline, and
      # a copy of a recipe in two files is a recipe that drifts. UV_RUN is
      # `uv run --locked --extra dev`. --locked on every uv run in this
      # workflow, for two reasons: a bare `uv run` re-resolves and may write a
      # new lockfile, and `--frozen` alone would install the committed
      # uv.lock even when pyproject.toml no longer matches it, so a dependency
      # edit that skipped `uv lock` would test a tree the manifest does not
      # describe. --locked refuses that instead of installing it.
      - run: make format-check
      - run: make lint
      # shellcheck and yamllint ship on the runner image; they cover the two
      # non-Python source sets ruff does not see (tools/*.sh, .github/*.yml).
      - run: make shell-lint
      - run: make yaml-lint

  web-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # package.json's packageManager field is the bun pin, so CI installs
          # the version a contributor's bun install would resolve to.
          bun-version-file: package.json
      # oxlint and the vnu jar are downloaded, not built, so node_modules is
      # fully reproducible from bun.lock. Caching it on the lockfile hash turns
      # every re-run of this job into a cache hit and keeps the java setup off
      # the critical path. The cache key never hits on a lockfile change, so a
      # dependency bump still installs from the registry; package.json is
      # hashed with it, because a tree installed by another bun is not the tree
      # bun.lock describes.
      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: "Lint JS/TS (oxlint: Rika-Labs strict + anti-slop) and HTML/CSS (Nu Html Checker)"
        # make web-lint owns the install, the bun/java preflight and both
        # linters, so this job and `make all` run the same commands. lint:html
        # runs tools/lint-html.py through the env synced above, which is why
        # this job needs uv at all.
        run: make web-lint

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Keep in sync with the Python classifiers in pyproject.toml;
        # tests/test_supply_chain.py fails when they drift apart.
        python-version: ["3.13", "3.14"]
        # The README claims recoverage "runs independently on any machine",
        # and pip users run it on all three OSes; exercise that claim on at
        # least one non-Linux runner per OS instead of asserting it untested.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - name: Run the suite
        # The same command as `make test`, spelled out rather than delegated:
        # this matrix runs on the Windows runner, where make is not part of the
        # image's guaranteed toolchain, and a missing make would fail a job
        # before it ran a test.
        run: >-
          uv run --locked --extra dev python -m pytest tests/ -v
          --ignore=tests/test_playwright.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The single interpreter pin, the same file uv builds the venv from.
          python-version-file: .python-version
      # The sibling rebrew checkout that [tool.uv.sources] resolves, fetched
      # at the pin the clone script owns. The composite action is the one
      # mechanism a job may use: it wraps that script and carries no pin of
      # its own, `make clone-rebrew` runs the same script for a workstation,
      # and no job may fetch the sibling any other way.
      - uses: ./.github/actions/sibling-rebrew
      - run: uv sync --locked --extra dev
      - name: Boot dashboard against a sample coverage.db and probe it
        run: make smoke
      - name: Negative smoke (corrupt DB must degrade, not lie)
        run: make smoke-fail

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config for every
          # later step, and every step in this workflow runs project code
          # (pytest, tools/smoke.py, bun) that could read it off disk.  No job
          # pushes, so there is nothing for it to authenticate: drop it as soon
          # as the tree is on disk.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv runs every install, lint and test in this workflow, so an
          # unpinned installer means two runs of one commit can resolve and
          # cache differently. setup-uv has no version-file input; the literal
          # is checked against the Makefile's UV_VERSION by test_supply_chain.
          version: "0.12.14"
          enable-cache: true
      # Hash-pinned inventory of the full resolved tree (runtime deps plus
      # every extra) so consumers and vuln scanners can see exactly what a
      # given build was made from. The npm devDependencies never ship with
      # the package, so they are not part of this inventory.
      - name: Export hashed dependency inventory
        # --frozen, not the --locked every other job uses: this job is the one
        # that does not clone the sibling, and --locked re-resolves the graph,
        # which means reading ../rebrew off the runner where it does not
        # exist. Reading the lock alone is the whole point of this job.
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --format requirements-txt --hashes \
            --output-file recoverage-python-sbom.txt
          # uv export renders the rebrew path dependency as an unversioned
          # `-e ../rebrew` line, so the export alone does not say which rebrew
          # a build was made from. Record the tag and commit from the single
          # pin in tools/ci_clone_rebrew.sh, the same one `make clone-rebrew`
          # and every other job read.
          ref="$(sed -n 's/^REBREW_REF="${REBREW_REF:-\(.*\)}"$/\1/p' tools/ci_clone_rebrew.sh)"
          sha="$(sed -n 's/^REBREW_SHA="${REBREW_SHA:-\(.*\)}"$/\1/p' tools/ci_clone_rebrew.sh)"
          [ -n "$ref" ] && [ -n "$sha" ]
          printf '\n# rebrew path-dependency pin\n# rebrew==%s @ %s\n' "$ref" "$sha" \
            >> recoverage-python-sbom.txt
          test -s recoverage-python-sbom.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recoverage-python-sbom
          path: recoverage-python-sbom.txt
          # A missing or empty export is a broken inventory, not a warning:
          # upload-artifact defaults to `warn` and would leave the job green
          # with no artifact attached for anyone to read.
          if-no-files-found: error
          retention-days: 30
