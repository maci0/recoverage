name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch supersedes the run in flight, whose result nobody
# will read. main keeps its history: a cancelled workflow would drop a required
# check from the commit list and leave the branch looking unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sibling-rebrew
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # rebrew resolves from ../rebrew ([tool.uv.sources]); actions/checkout
      # cannot write outside the workspace, so clone it where uv looks.
      - run: bash tools/ci_clone_rebrew.sh "$GITHUB_WORKSPACE/../rebrew"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src/ tests/ tools/
      - run: uv run ruff check src/ tests/ tools/
      # shellcheck and yamllint ship on the runner image; they cover the two
      # non-Python source sets ruff does not see (tools/*.sh, .github/*.yml).
      - run: make shell-lint
      - run: make yaml-lint

  web-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sibling-rebrew
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # rebrew resolves from ../rebrew ([tool.uv.sources]); actions/checkout
      # cannot write outside the workspace, so clone it where uv looks.
      - run: bash tools/ci_clone_rebrew.sh "$GITHUB_WORKSPACE/../rebrew"
      - run: uv sync --frozen --extra dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      # oxlint and the vnu jar are downloaded, not built, so node_modules is
      # fully reproducible from bun.lock. Caching it on the lockfile hash turns
      # every re-run of this job into a cache hit and keeps the java setup off
      # the critical path. The cache key never hits on a lockfile change, so a
      # dependency bump still installs from the registry.
      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: "Lint JS/TS (oxlint: Rika-Labs strict + anti-slop)"
        run: bun run lint:js
      - name: Lint HTML/CSS (Nu Html Checker)
        run: bun run lint:html

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Keep in sync with the Python classifiers in pyproject.toml.
        python-version: ["3.13", "3.14"]
        # The README claims recoverage "runs independently on any machine",
        # and pip users run it on all three OSes; exercise that claim on at
        # least one non-Linux runner per OS instead of asserting it untested.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sibling-rebrew
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # rebrew resolves from ../rebrew ([tool.uv.sources]); actions/checkout
      # cannot write outside the workspace, so clone it where uv looks.
      - run: bash tools/ci_clone_rebrew.sh "$GITHUB_WORKSPACE/../rebrew"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --ignore=tests/test_playwright.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sibling-rebrew
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # rebrew resolves from ../rebrew ([tool.uv.sources]); actions/checkout
      # cannot write outside the workspace, so clone it where uv looks.
      - run: bash tools/ci_clone_rebrew.sh "$GITHUB_WORKSPACE/../rebrew"
      - run: uv sync --frozen --extra dev
      - name: Boot dashboard against a sample coverage.db and probe it
        run: uv run python tools/smoke.py
      - name: Negative smoke (corrupt DB must degrade, not lie)
        run: uv run python tools/smoke.py --expect-failure

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # Hash-pinned inventory of the full resolved tree (runtime deps plus
      # every extra) so consumers and vuln scanners can see exactly what a
      # given build was made from. The npm devDependencies never ship with
      # the package, so they are not part of this inventory.
      - name: Export hashed dependency inventory
        run: >-
          uv export --frozen --all-extras --format requirements-txt --hashes
          --output-file recoverage-python-sbom.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recoverage-python-sbom
          path: recoverage-python-sbom.txt
