# Keep both lockfiles and CI actions current. Weekly cadence; minor/patch
# updates are grouped into one PR per ecosystem so majors stay individually
# reviewable. Bumping @rikalabs/oxlint-standards additionally requires
# re-running tools/flatten_rikalabs_strict.py (see AGENTS.md).
# The JavaScript lockfile is bun.lock, which the npm ecosystem here cannot
# read: Dependabot aborts with "detected that Bun is misconfigured" and
# "This project has a `bun.lock` file but no `package-lock.json`, `yarn.lock`
# or `pnpm-lock.yaml`". renovate.json owns those packages, and its
# npm-minor-and-patch group names both managers that can resolve a bun.lock
# (`npm` and `bun`): Renovate moved bun.lock handling out of the npm manager
# and into a `bun` manager, so a group naming only the older one matches
# nothing and every devDependency bump opens its own PR against the policy
# above. A name Renovate no longer uses matches nothing and costs nothing, so
# the group lists both.
# The Python manifest resolves rebrew through [tool.uv.sources] as a sibling
# checkout (`path = "../rebrew"`), and Dependabot aborts the whole uv job with
# "The following path based dependencies could not be retrieved". Renovate
# reads uv sources, so renovate.json owns the Python packages too.
# renovate.json's `enabledManagers` names that split (pep621/uv, bun/npm) and
# leaves every other manager off: config:recommended does not restrict managers,
# so without it Renovate's default list also covered github-actions and the two
# bots opened a PR each against the same pinned action SHAs, with whichever one
# merged first making the other's stale. This file is the single owner of the
# action pins.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Ungrouped, every minor action bump opened its own PR, which the policy
      # above says should not happen: one PR per ecosystem for minor/patch,
      # majors left on their own so a breaking runner change is reviewable.
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
