# Keep both lockfiles and CI actions current. Weekly cadence; minor/patch
# updates are grouped into one PR per ecosystem so majors stay individually
# reviewable. Bumping @rikalabs/oxlint-standards additionally requires
# re-running tools/flatten-rikalabs-strict.py (see AGENTS.md).
# The JavaScript lockfile is bun.lock, which the npm ecosystem here cannot
# read: Dependabot aborts with "detected that Bun is misconfigured" and
# "This project has a `bun.lock` file but no `package-lock.json`, `yarn.lock`
# or `pnpm-lock.yaml`". Renovate's npm manager reads bun.lock, so
# renovate.json owns those packages.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # rebrew is a path dependency in pyproject.toml, so Dependabot cannot
    # retrieve it and aborts the whole uv job with "The following path based
    # dependencies could not be retrieved: \"rebrew\" at /pyproject.toml".
    # It is not an index package, so there is nothing for the updater to do
    # with it either way.
    ignore:
      - dependency-name: "rebrew"
    groups:
      uv-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Ungrouped, every minor action bump opened its own PR, which the policy
      # above says should not happen: one PR per ecosystem for minor/patch,
      # majors left on their own so a breaking runner change is reviewable.
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
