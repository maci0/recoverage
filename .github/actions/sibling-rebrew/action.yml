name: sibling-rebrew
description: >-
  Optional upstream source checkout at the guarded tag/commit pin in
  tools/ci_clone_rebrew.sh. Normal builds use the public wheel.

inputs:
  clone-url:
    description: >-
      Git URL to clone the sibling checkout from, for a caller pointing at a
      fork or a mirror.  Empty by default: the URL lives in
      tools/ci_clone_rebrew.sh, and a default here would be a second copy of
      it that a move of the repository could leave disagreeing with the one
      `make clone-rebrew` uses.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # An opt-in source-development job shares only the exact verified pin.
    # The key hashes the script, so
    # the cache holds exactly the commit the script pins and a pin bump misses
    # it entirely. There is no restore-keys fallback for the same reason the
    # clone has no branch fallback: an older rebrew that still resolves is
    # exactly the dependency failure the pin exists to catch.
    - name: Restore the sibling rebrew checkout
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/../rebrew
        key: rebrew-${{ runner.os }}-${{ hashFiles('tools/ci_clone_rebrew.sh') }}
    - name: Clone the sibling rebrew checkout
      shell: bash
      # An empty clone-url reaches the script as REBREW_URL="", and the
      # script's own ${REBREW_URL:-...} default is what supplies the URL then.
      env:
        REBREW_URL: ${{ inputs.clone-url }}
      run: bash "$GITHUB_WORKSPACE/tools/ci_clone_rebrew.sh" "$GITHUB_WORKSPACE/../rebrew"
